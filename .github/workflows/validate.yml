name: Validate

# HACS and hassfest checks on the published tree. The source repository runs
# every other gate; the HACS action refuses private repositories, so it runs here.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands: the integration domain is not registered in home-assistant/brands.
          # Temporary, documented exception -- remove once the domain is submitted upstream.
          # license: the license is "all rights reserved", which has no SPDX identifier.
          # HACS installs from a custom repository without one; its default store would not.
          ignore: brands license

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
